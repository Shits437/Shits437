<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            background-color: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(255, 75, 110, 0.2);
        }
        h1 { color: #ff4b6e; font-size: 2.5rem; }
        p { color: #555; font-size: 1.2rem; }
        .heart { color: #ff4b6e; font-size: 50px; margin-bottom: 10px; }
        .buttons { margin-top: 2rem; }
        
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 0 10px;
        }

        #yesBtn {
            background-color: #ff4b6e;
            color: white;
        }

        #noBtn {
            background-color: #ddd;
            color: #777;
            position: relative;
        }

        #yesBtn:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">❤️</div>
        <h1>Hey momma,</h1>
        <p>I’ve been thinking about how lucky I am to have you.</p>
        <p><strong>Will you be my Valentine baby?</strong></p>
        
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">YES!</button>
            <button id="noBtn" onmouseover="moveButton()">No</button>
        </div>
    </div>

    <script>
        function celebrate() {
            document.querySelector('.container').innerHTML = `
                <div class="heart">💖</div>
                <h1>Yay! Can't wait!</h1>
                <p>You just made me the happiest person ever.</p>
                <p>February 14th is going to be special. ✨</p>
                <p>Utanipea nyonyo momma</p>  
            `;
        }

        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
